<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9ff"><title>Riviraa Desk — Private Contact Manager</title>
<style>
:root{--bg:#f5f7fc;--panel:#fff;--ink:#17233f;--muted:#71809c;--line:#e6ebf5;--blue:#1769f5;--blue2:#eaf2ff;--green:#10a66a;--greenbg:#e8fbf2;--orange:#f59e0b;--orangebg:#fff5df;--red:#ef476f;--redbg:#fff0f3;--purple:#7657f6;--shadow:0 8px 28px #253b6810}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}a{color:inherit;text-decoration:none}.app{max-width:1120px;margin:auto;min-height:100dvh;padding-bottom:84px}.top{position:sticky;top:0;z-index:5;background:#f7f9fff0;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:20px;letter-spacing:-.6px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#1670ff,#5b8fff);color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 5px 12px #1769f533}.brand span span{color:var(--blue)}.subbrand{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:0}.top-actions{display:flex;gap:8px}.iconbtn{width:38px;height:38px;background:#fff;border:1px solid var(--line);border-radius:13px;color:#53617b;font-size:17px}.main{padding:16px;max-width:950px;margin:auto}.greeting{display:flex;align-items:flex-start;justify-content:space-between;margin:7px 0 18px}.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);font-weight:800}.greeting h1{margin:3px 0;font-size:25px;letter-spacing:-.8px}.muted{color:var(--muted)}.privacy{display:inline-flex;align-items:center;gap:5px;background:var(--greenbg);color:#08794b;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:750;white-space:nowrap}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:13px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:var(--shadow);min-width:0}.stat .s-icon{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px;font-size:17px}.stat strong{display:block;font-size:27px;letter-spacing:-1px;line-height:1.1}.stat small{color:var(--muted);font-size:12px}.stat.blue .s-icon{background:var(--blue2);color:var(--blue)}.stat.green .s-icon{background:var(--greenbg);color:var(--green)}.stat.orange .s-icon{background:var(--orangebg);color:var(--orange)}.stat.red .s-icon{background:var(--redbg);color:var(--red)}.section{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:13px 0;box-shadow:var(--shadow)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}.section h2{font-size:16px;margin:0;letter-spacing:-.3px}.linkbtn{background:transparent;color:var(--blue);font-weight:750;padding:4px}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.action{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 3px;border-radius:15px;background:#f5f8ff;color:var(--blue);font-size:11px;font-weight:750}.action span{font-size:22px}.action.green{background:var(--greenbg);color:var(--green)}.action.purple{background:#f1edff;color:var(--purple)}.action.orange{background:var(--orangebg);color:#b97700}.task{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid #f0f2f8}.task:first-of-type{border-top:0}.task-icon{width:35px;height:35px;display:grid;place-items:center;border-radius:12px;background:var(--orangebg);color:#bb7b00}.task-main{flex:1;min-width:0}.task-main b{display:block;font-size:13px}.task-main small{color:var(--muted)}.pill{border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800;display:inline-block;white-space:nowrap}.pill.Pending{background:var(--redbg);color:#c92b50}.pill.Contacted{background:var(--greenbg);color:#08794b}.pill.Follow-up{background:var(--orangebg);color:#9d6500}.pill.Interested{background:#eeeaff;color:#6545d9}.pill.Cold{background:#edf0f6;color:#66738a}.bottomnav{position:fixed;z-index:9;bottom:0;left:0;right:0;padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center}.navinner{width:min(700px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav{background:transparent;color:#8994a9;padding:6px 1px;border-radius:13px;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}.nav span{font-size:20px}.nav.active{background:var(--blue2);color:var(--blue)}.page-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 15px}.page-title h1{font-size:24px;margin:0;letter-spacing:-.7px}.primary,.secondary,.danger{border-radius:12px;padding:11px 14px;font-weight:800}.primary{background:var(--blue);color:#fff;box-shadow:0 6px 14px #1769f52b}.secondary{background:#f0f4fc;color:#334461;border:1px solid var(--line)}.danger{background:var(--redbg);color:#c92b50}.searchrow{display:flex;gap:8px;margin-bottom:12px}.field{width:100%;min-width:0;border:1px solid #dfe6f2;border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}.field:focus{border-color:#79a6ff;box-shadow:0 0 0 3px #1769f514}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}.filter{background:#f0f3fa;color:#65728b;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:11px;font-weight:800}.filter.active{background:var(--blue);color:white}.contact{display:flex;gap:11px;align-items:center;padding:13px 0;border-top:1px solid #f0f2f8}.avatar{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;flex-shrink:0;background:#e8efff;color:var(--blue);font-weight:850}.contactinfo{flex:1;min-width:0}.contactinfo b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.contactinfo small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.contacttools{display:flex;gap:5px}.mini{width:32px;height:32px;border-radius:10px;background:#f1f5ff;color:var(--blue);font-size:15px}.mini.whats{background:var(--greenbg);color:var(--green)}.mini.sms{background:#eaf3ff;color:#2774d9}.empty{text-align:center;padding:30px 12px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.formgrid{display:grid;grid-template-columns:1fr;gap:10px}.formgrid label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:5px}.formactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.template{border:1px solid var(--line);border-radius:15px;padding:13px;margin:9px 0}.template p{color:#5e6b83;white-space:pre-wrap;margin:7px 0 12px;font-size:12px}.template-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.template-head b{font-size:13px}.metricrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:13px;border-radius:15px;background:#f6f8fd}.metric b{font-size:23px;display:block}.barrow{display:flex;align-items:center;gap:10px;margin:12px 0}.barlabel{width:100px;font-size:12px;color:#53617b}.bartrack{flex:1;height:9px;background:#edf1f8;border-radius:999px;overflow:hidden}.barfill{height:100%;background:linear-gradient(90deg,#1769f5,#62a0ff);border-radius:999px}.barval{width:35px;text-align:right;font-size:11px;font-weight:800}.notice{padding:12px;border:1px solid #f5dca1;background:#fff9e9;border-radius:14px;color:#765311;font-size:12px}.privacybox{padding:14px;border-radius:16px;background:var(--greenbg);color:#08794b;font-size:12px}.hidden{display:none!important}.small{font-size:11px}.modalback{position:fixed;inset:0;z-index:20;background:#101a2c77;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{background:#fff;border-radius:23px 23px 16px 16px;width:min(600px,100%);max-height:88dvh;overflow:auto;padding:20px;box-shadow:0 20px 60px #11182733}.modal h2{margin:0 0 14px}.modalclose{float:right;background:#f0f3f9;border-radius:50%;width:32px;height:32px;font-size:18px}.toast{position:fixed;z-index:40;bottom:90px;left:50%;transform:translateX(-50%);background:#18233c;color:white;border-radius:12px;padding:11px 16px;box-shadow:0 10px 30px #0003;max-width:90%;font-size:12px}.footer-note{text-align:center;color:#9aa5b8;font-size:10px;padding:15px 0}
@media(min-width:650px){.main{padding:25px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.formgrid{grid-template-columns:1fr 1fr}.formgrid .wide{grid-column:1/-1}.bottomnav{top:68px;bottom:auto;left:auto;right:calc((100% - min(1120px,100%))/2);border:1px solid var(--line);border-radius:0 0 0 18px;padding:6px 12px}.navinner{width:360px}.app{padding-bottom:25px}.top{padding-left:25px;padding-right:25px}.modalback{align-items:center}.modal{border-radius:23px}.toast{bottom:25px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">✦</div><div><span>Riviraa <span>Desk</span></span><div class="subbrand">Your private contact manager</div></div></div><div class="top-actions"><button class="iconbtn" title="Search" onclick="go('contacts');document.getElementById('search').focus()">⌕</button><button class="iconbtn" title="Add contact" onclick="openContact()">＋</button></div></header>
<main class="main" id="view"></main>
<nav class="bottomnav"><div class="navinner">
<button class="nav active" data-page="home" onclick="go('home')"><span>⌂</span>Home</button><button class="nav" data-page="contacts" onclick="go('contacts')"><span>♙</span>Contacts</button><button class="nav" data-page="followups" onclick="go('followups')"><span>◷</span>Follow-ups</button><button class="nav" data-page="templates" onclick="go('templates')"><span>✉</span>Templates</button><button class="nav" data-page="more" onclick="go('more')"><span>☷</span>More</button>
</div></nav><div id="modalroot"></div><input type="file" id="importfile" class="hidden" accept=".csv,.xlsx,.xls,.json"><div id="toastroot"></div></div>
<script>
const DB='contactflow-premium-v1', STORE='contacts';
let db,contacts=[],page='home',editingId=null,activeFilter='All',templateList=JSON.parse(localStorage.getItem('cf_templates')||'null')||[
{name:'Masters Games Invitation',channel:'WhatsApp',body:'Hello {name}! 🏆\\nYou are invited to the 15th State Masters Games 2026–27, on 14–15 November 2026 at Bilaspur, Himachal Pradesh. Reply for registration details.'},
{name:'Follow-up Reminder',channel:'WhatsApp',body:'Hello {name}, following up regarding {category}. Please let me know a convenient time to connect. Thank you!'},
{name:'General Introduction',channel:'SMS',body:'Hello {name}, thank you for connecting. Please save this number for future updates.'}
];
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(STORE)){let s=d.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});s.createIndex('phone','phone',{unique:false})}};r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error)})}
function save(c){return new Promise((resolve,reject)=>{let t=db.transaction(STORE,'readwrite'),s=t.objectStore(STORE);c.updatedAt=new Date().toISOString();if(c.id){s.put(c);resolve(c.id)}else{c.createdAt=c.createdAt||new Date().toISOString();let r=s.add(c);r.onsuccess=()=>{c.id=r.result;resolve(c.id)};r.onerror=()=>reject(r.error)}})}
function all(){return new Promise((resolve,reject)=>{let r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function remove(id){return new Promise((resolve,reject)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(Number(id));r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
async function refresh(){contacts=await all();render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalizePhone(p){return String(p||'').replace(/\D/g,'').replace(/^0+/,'')}
function status(c){return c.status||'Pending'}
function toast(s){let r=document.getElementById('toastroot');r.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>r.innerHTML='',2600)}
function go(p){page=p;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));render();window.scrollTo(0,0)}
function render(){let v=document.getElementById('view');if(page==='home')v.innerHTML=homeView();else if(page==='contacts')v.innerHTML=contactsView();else if(page==='followups')v.innerHTML=followupsView();else if(page==='templates')v.innerHTML=templatesView();else if(page==='more')v.innerHTML=moreView();else if(page==='import')v.innerHTML=importView();else if(page==='analytics')v.innerHTML=analyticsView();else v.innerHTML=homeView()}
function homeView(){let today=new Date().toISOString().slice(0,10),due=contacts.filter(c=>c.nextDate&&c.nextDate<=today).length,pend=contacts.filter(c=>status(c)==='Pending').length;return `<div class="greeting"><div><div class="eyebrow">YOUR WORKSPACE</div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'}</h1><div class="muted">Your contacts. Your control.</div></div><div class="privacy">🔒 Local & private</div></div><div class="grid stats"><div class="stat blue"><div class="s-icon">♙</div><strong>${contacts.length.toLocaleString('en-IN')}</strong><small>Total contacts</small></div><div class="stat green"><div class="s-icon">✓</div><strong>${contacts.filter(c=>status(c)==='Contacted').length}</strong><small>Contacted</small></div><div class="stat orange"><div class="s-icon">◷</div><strong>${due}</strong><small>Follow-ups due</small></div><div class="stat red"><div class="s-icon">!</div><strong>${pend}</strong><small>Pending</small></div></div><div class="section"><div class="section-head"><h2>Quick actions</h2></div><div class="actions"><button class="action" onclick="openContact()"><span>＋</span>Add contact</button><button class="action green" onclick="go('import')"><span>⇧</span>Import Excel</button><button class="action purple" onclick="exportExcel()"><span>▦</span>Export Excel</button><button class="action orange" onclick="backup()"><span>⬡</span>Backup</button></div></div><div class="section"><div class="section-head"><h2>Upcoming follow-ups</h2><button class="linkbtn" onclick="go('followups')">View all →</button></div>${due?contacts.filter(c=>c.nextDate&&c.nextDate<=today).slice(0,5).map(c=>`<div class="task"><div class="task-icon">◷</div><div class="task-main"><b>${esc(c.name)}</b><small>${esc(c.nextDate)} · ${esc(c.nextAction||'Follow-up')}</small></div><button class="secondary" onclick="showDetail(${c.id})">Open</button></div>`).join(''):'<div class="empty"><strong>All clear for now</strong>Set follow-up dates to see reminders here.</div>'}</div>${contacts.length===0?`<div class="notice">Start by importing your Excel/CSV contact list or add a contact manually. Your records stay in this browser on this device.</div>`:''}<div class="footer-note">Riviraa Desk · Private by design · No cloud database</div>`}
function contactsView(){let q=(document.getElementById('search')?.value||'').toLowerCase();let list=contacts.filter(c=>(activeFilter==='All'||status(c)===activeFilter)&&[c.name,c.phone,c.city,c.state,c.game,c.category,(c.tags||[]).join(' '),c.notes].join(' ').toLowerCase().includes(q));return `<div class="page-title"><div><div class="eyebrow">YOUR DATABASE</div><h1>Contacts</h1><div class="muted small">${contacts.length.toLocaleString('en-IN')} saved locally</div></div><button class="primary" onclick="openContact()">＋ Add</button></div><div class="searchrow"><input id="search" class="field" placeholder="Search name, phone, game, district…" value="${esc(q)}" oninput="render()"><button class="secondary" onclick="go('import')">Import</button></div><div class="filters">${['All','Pending','Contacted','Follow-up','Interested','Cold'].map(s=>`<button class="filter ${activeFilter===s?'active':''}" onclick="activeFilter='${s}';render()">${s}</button>`).join('')}</div><div class="section">${list.length?list.map(c=>`<div class="contact"><div class="avatar">${esc((c.name||'?').slice(0,1).toUpperCase())}</div><div class="contactinfo" onclick="showDetail(${c.id})" style="cursor:pointer"><b>${esc(c.name)}</b><small>${esc(c.phone)} · ${esc(c.city||c.state||c.game||'No location')}</small><small><span class="pill ${esc(status(c))}">${esc(status(c))}</span> ${esc(c.game||c.category||'')}</small></div><div class="contacttools"><button class="mini" title="Call" onclick="event.stopPropagation();callContact(${c.id})">☎</button><button class="mini whats" title="WhatsApp" onclick="event.stopPropagation();whatsContact(${c.id})">◉</button></div></div>`).join(''):'<div class="empty"><strong>No contacts found</strong>Add a contact or import an Excel/CSV file.</div>'}</div>`}
function followupsView(){let today=new Date().toISOString().slice(0,10),list=contacts.filter(c=>c.nextDate).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));return `<div class="page-title"><div><div class="eyebrow">STAY CONNECTED</div><h1>Follow-ups</h1></div><button class="primary" onclick="openContact()">＋ Add</button></div><div class="section">${list.length?list.map(c=>`<div class="task"><div class="task-icon">${c.nextDate<today?'!':'◷'}</div><div class="task-main"><b>${esc(c.name)}</b><small>${esc(c.nextDate)} · ${esc(c.nextAction||'Follow-up')}</small></div><span class="pill ${c.nextDate<today?'Pending':'Follow-up'}">${c.nextDate<today?'Overdue':c.nextDate===today?'Today':'Upcoming'}</span><button class="secondary" onclick="showDetail(${c.id})">Open</button></div>`).join(''):'<div class="empty"><strong>No follow-ups scheduled</strong>Add a date to any contact to plan your next action.</div>'}</div>`}
function moreView(){return `<div class="page-title"><div><div class="eyebrow">TOOLS & PREFERENCES</div><h1>More</h1></div></div><div class="section">${[["▤","Import Excel / CSV","go('import')"],["⇩","Export contacts as CSV","exportCSV()"],["▦","Export Excel backup","exportExcel()"],["⬡","Create local backup","backup()"],["↻","Restore backup","document.getElementById('importfile').accept='.json';document.getElementById('importfile').click()"],["▦","Analytics dashboard","go('analytics')"],["♙","Find duplicate contacts","findDuplicates()"],["✉","Message templates","go('templates')"],["⚙","App settings","settings()"]].map(([i,t,a])=>`<div class="task" onclick="${a}" style="cursor:pointer"><div class="task-icon">${i}</div><div class="task-main"><b>${t}</b><small>${t.toLowerCase().includes('backup')||t.includes('Restore')?'Saved only where you choose':'Manage your private contacts'}</small></div><span class="muted">›</span></div>`).join('')}</div><div class="section"><div class="privacybox"><b>🔒 Your data stays on this device</b><br>ContactFlow stores records in this browser’s IndexedDB. It does not upload contacts to a ContactFlow server. If browser data is cleared, your device is lost, or you use another browser, restore from a backup.</div></div><div class="section"><h2>Data management</h2><p class="muted small">You can clear all locally stored contacts. This cannot be undone unless you have a backup.</p><button class="danger" onclick="clearAll()">Delete all local contacts</button></div><div class="footer-note">Riviraa Desk · Free-first · No CRM subscription</div>`}
