<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9ff"><title>ContactFlow — Private Contact Manager</title>
<style>
:root{--bg:#f5f7fc;--panel:#fff;--ink:#17233f;--muted:#71809c;--line:#e6ebf5;--blue:#1769f5;--blue2:#eaf2ff;--green:#10a66a;--greenbg:#e8fbf2;--orange:#f59e0b;--orangebg:#fff5df;--red:#ef476f;--redbg:#fff0f3;--purple:#7657f6;--shadow:0 8px 28px #253b6810}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}a{color:inherit;text-decoration:none}.app{max-width:1120px;margin:auto;min-height:100dvh;padding-bottom:84px}.top{position:sticky;top:0;z-index:5;background:#f7f9fff0;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:20px;letter-spacing:-.6px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#1670ff,#5b8fff);color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 5px 12px #1769f533}.brand span span{color:var(--blue)}.subbrand{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:0}.top-actions{display:flex;gap:8px}.iconbtn{width:38px;height:38px;background:#fff;border:1px solid var(--line);border-radius:13px;color:#53617b;font-size:17px}.main{padding:16px;max-width:950px;margin:auto}.greeting{display:flex;align-items:flex-start;justify-content:space-between;margin:7px 0 18px}.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);font-weight:800}.greeting h1{margin:3px 0;font-size:25px;letter-spacing:-.8px}.muted{color:var(--muted)}.privacy{display:inline-flex;align-items:center;gap:5px;background:var(--greenbg);color:#08794b;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:750;white-space:nowrap}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:13px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:var(--shadow);min-width:0}.stat .s-icon{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px;font-size:17px}.stat strong{display:block;font-size:27px;letter-spacing:-1px;line-height:1.1}.stat small{color:var(--muted);font-size:12px}.stat.blue .s-icon{background:var(--blue2);color:var(--blue)}.stat.green .s-icon{background:var(--greenbg);color:var(--green)}.stat.orange .s-icon{background:var(--orangebg);color:var(--orange)}.stat.red .s-icon{background:var(--redbg);color:var(--red)}.section{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:13px 0;box-shadow:var(--shadow)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}.section h2{font-size:16px;margin:0;letter-spacing:-.3px}.linkbtn{background:transparent;color:var(--blue);font-weight:750;padding:4px}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.action{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 3px;border-radius:15px;background:#f5f8ff;color:var(--blue);font-size:11px;font-weight:750}.action span{font-size:22px}.action.green{background:var(--greenbg);color:var(--green)}.action.purple{background:#f1edff;color:var(--purple)}.action.orange{background:var(--orangebg);color:#b97700}.task{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid #f0f2f8}.task:first-of-type{border-top:0}.task-icon{width:35px;height:35px;display:grid;place-items:center;border-radius:12px;background:var(--orangebg);color:#bb7b00}.task-main{flex:1;min-width:0}.task-main b{display:block;font-size:13px}.task-main small{color:var(--muted)}.pill{border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800;display:inline-block;white-space:nowrap}.pill.Pending{background:var(--redbg);color:#c92b50}.pill.Contacted{background:var(--greenbg);color:#08794b}.pill.Follow-up{background:var(--orangebg);color:#9d6500}.pill.Interested{background:#eeeaff;color:#6545d9}.pill.Cold{background:#edf0f6;color:#66738a}.bottomnav{position:fixed;z-index:9;bottom:0;left:0;right:0;padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center}.navinner{width:min(700px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav{background:transparent;color:#8994a9;padding:6px 1px;border-radius:13px;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}.nav span{font-size:20px}.nav.active{background:var(--blue2);color:var(--blue)}.page-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 15px}.page-title h1{font-size:24px;margin:0;letter-spacing:-.7px}.primary,.secondary,.danger{border-radius:12px;padding:11px 14px;font-weight:800}.primary{background:var(--blue);color:#fff;box-shadow:0 6px 14px #1769f52b}.secondary{background:#f0f4fc;color:#334461;border:1px solid var(--line)}.danger{background:var(--redbg);color:#c92b50}.searchrow{display:flex;gap:8px;margin-bottom:12px}.field{width:100%;min-width:0;border:1px solid #dfe6f2;border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}.field:focus{border-color:#79a6ff;box-shadow:0 0 0 3px #1769f514}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}.filter{background:#f0f3fa;color:#65728b;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:11px;font-weight:800}.filter.active{background:var(--blue);color:white}.contact{display:flex;gap:11px;align-items:center;padding:13px 0;border-top:1px solid #f0f2f8}.avatar{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;flex-shrink:0;background:#e8efff;color:var(--blue);font-weight:850}.contactinfo{flex:1;min-width:0}.contactinfo b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.contactinfo small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.contacttools{display:flex;gap:5px}.mini{width:32px;height:32px;border-radius:10px;background:#f1f5ff;color:var(--blue);font-size:15px}.mini.whats{background:var(--greenbg);color:var(--green)}.mini.sms{background:#eaf3ff;color:#2774d9}.empty{text-align:center;padding:30px 12px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.formgrid{display:grid;grid-template-columns:1fr;gap:10px}.formgrid label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:5px}.formactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.template{border:1px solid var(--line);border-radius:15px;padding:13px;margin:9px 0}.template p{color:#5e6b83;white-space:pre-wrap;margin:7px 0 12px;font-size:12px}.template-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.template-head b{font-size:13px}.metricrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:13px;border-radius:15px;background:#f6f8fd}.metric b{font-size:23px;display:block}.barrow{display:flex;align-items:center;gap:10px;margin:12px 0}.barlabel{width:100px;font-size:12px;color:#53617b}.bartrack{flex:1;height:9px;background:#edf1f8;border-radius:999px;overflow:hidden}.barfill{height:100%;background:linear-gradient(90deg,#1769f5,#62a0ff);border-radius:999px}.barval{width:35px;text-align:right;font-size:11px;font-weight:800}.notice{padding:12px;border:1px solid #f5dca1;background:#fff9e9;border-radius:14px;color:#765311;font-size:12px}.privacybox{padding:14px;border-radius:16px;background:var(--greenbg);color:#08794b;font-size:12px}.hidden{display:none!important}.small{font-size:11px}.modalback{position:fixed;inset:0;z-index:20;background:#101a2c77;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{background:#fff;border-radius:23px 23px 16px 16px;width:min(600px,100%);max-height:88dvh;overflow:auto;padding:20px;box-shadow:0 20px 60px #11182733}.modal h2{margin:0 0 14px}.modalclose{float:right;background:#f0f3f9;border-radius:50%;width:32px;height:32px;font-size:18px}.toast{position:fixed;z-index:40;bottom:90px;left:50%;transform:translateX(-50%);background:#18233c;color:white;border-radius:12px;padding:11px 16px;box-shadow:0 10px 30px #0003;max-width:90%;font-size:12px}.footer-note{text-align:center;color:#9aa5b8;font-size:10px;padding:15px 0}
@media(min-width:650px){.main{padding:25px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.formgrid{grid-template-columns:1fr 1fr}.formgrid .wide{grid-column:1/-1}.bottomnav{top:68px;bottom:auto;left:auto;right:calc((100% - min(1120px,100%))/2);border:1px solid var(--line);border-radius:0 0 0 18px;padding:6px 12px}.navinner{width:360px}.app{padding-bottom:25px}.top{padding-left:25px;padding-right:25px}.modalback{align-items:center}.modal{border-radius:23px}.toast{bottom:25px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">✦</div><div><span>Contact<span>Flow</span></span><div class="subbrand">Your private contact manager</div></div></div><div class="top-actions"><button class="iconbtn" title="Search" onclick="go('contacts');document.getElementById('search').focus()">⌕</button><button class="iconbtn" title="Add contact" onclick="openContact()">＋</button></div></header>
<main class="main" id="view"></main>
<nav class="bottomnav"><div class="navinner">
<button class="nav active" data-page="home" onclick="go('home')"><span>⌂</span>Home</button><button class="nav" data-page="contacts" onclick="go('contacts')"><span>♙</span>Contacts</button><button class="nav" data-page="templates" onclick="go('templates')"><span>✉</span>Templates</button><button class="nav" data-page="followups" onclick="go('followups')"><span>◷</span>Follow-up</button><button class="nav" data-page="more" onclick="go('more')"><span>⋯</span>More</button>
</div></nav></div><div id="modalroot"></div><div id="toastroot"></div>
<input id="importfile" type="file" accept=".csv,.txt,.xlsx,.xls,.json" class="hidden">
<script>
const DB='contactflow-premium-v1', STORE='contacts';
let db, contacts=[], page='home', activeFilter='All', query='', editId=null, templateList=[
{id:'t1',name:'Introduction',channel:'WhatsApp',body:'Hi {name},\nMera naam {your_name} hai. Aap se thodi baat karni thi.'},
{id:'t2',name:'Follow-up',channel:'WhatsApp',body:'Hi {name},\nHumari baat hui thi. Kya aap abhi interested hain?'},
{id:'t3',name:'Thank You',channel:'WhatsApp',body:'Dhanyavaad {name},\nAapka time dene ke liye shukriya.'},
{id:'t4',name:'Call Back',channel:'SMS',body:'Hi {name}, please call me back when convenient. Thank you.'}
];
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(STORE)){let s=d.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});s.createIndex('phone','phone',{unique:false});}};r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)})}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function all(){return new Promise((res,rej)=>{let r=tx().getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function save(c){return new Promise((res,rej)=>{let s=tx('readwrite'),r=c.id?s.put(c):s.add(c);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function del(id){return new Promise((res,rej)=>{let r=tx('readwrite').delete(Number(id));r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function toast(s){let root=document.getElementById('toastroot');root.innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>root.innerHTML='',2800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nfmt(n){return Number(n||0).toLocaleString('en-IN')}
function today(){return new Date().toISOString().slice(0,10)}
function status(c){return c.status||'Pending'}
function initials(n){return (n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function countStatus(s){return contacts.filter(c=>status(c)===s).length}
function overdue(c){return c.nextDate&&c.nextDate<today()&&status(c)!=='Contacted'}
function dueToday(c){return c.nextDate===today()}
function normalizePhone(s){return String(s||'').replace(/[^\d+]/g,'')}
function phoneHref(c){return 'tel:'+normalizePhone(c.phone)}
function waHref(c,body=''){let p=normalizePhone(c.phone).replace(/^\+/,'');return 'https://wa.me/'+p+(body?'?text='+encodeURIComponent(fillTemplate(body,c)):'')}
function smsHref(c,body=''){return 'sms:'+normalizePhone(c.phone)+'?body='+encodeURIComponent(fillTemplate(body,c))}
function fillTemplate(body,c){return body.replace(/\{name\}/gi,c.name||'').replace(/\{phone\}/gi,c.phone||'').replace(/\{city\}/gi,c.city||'').replace(/\{category\}/gi,c.category||'').replace(/\{your_name\}/gi,'')}
function touch(c,kind){c.history=c.history||[];c.history.unshift({kind,at:new Date().toISOString()});c.lastContact=today();save(c).then(refresh).catch(()=>{});}
function contactActions(c){return `<div class="contacttools"><button class="mini" title="Call" onclick="logAction(${c.id},'Call');location.href='${phoneHref(c)}'">☎</button><button class="mini whats" title="WhatsApp" onclick="logAction(${c.id},'WhatsApp');window.open('${waHref(c)}','_blank')">◉</button><button class="mini sms" title="SMS" onclick="logAction(${c.id},'SMS');location.href='${smsHref(c)}'">▰</button></div>`}
function logAction(id,kind){let c=contacts.find(x=>x.id===id);if(c){c.history=c.history||[];c.history.unshift({kind,at:new Date().toISOString()});c.lastContact=today();save(c).then(refresh)}}
function contactRow(c){return `<div class="contact"><div class="avatar">${esc(initials(c.name))}</div><div class="contactinfo" onclick="showDetail(${c.id})"><b>${esc(c.name||'Unnamed')}</b><small>${esc(c.phone||'No phone')} · ${esc(c.city||c.category||'No category')}</small><small><span class="pill ${esc(status(c).replace(' ','-'))}">${esc(status(c))}</span>${c.nextDate?' · '+esc(c.nextDate):''}</small></div>${contactActions(c)}<button class="mini" onclick="showDetail(${c.id})" title="Details">›</button></div>`}
function refresh(){all().then(x=>{contacts=x;render()})}
function go(p){page=p;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}
function render(){let v=document.getElementById('view');if(page==='home')v.innerHTML=homeView();else if(page==='contacts')v.innerHTML=contactsView();else if(page==='followups')v.innerHTML=followView();else if(page==='templates')v.innerHTML=templatesView();else if(page==='analytics')v.innerHTML=analyticsView();else if(page==='more')v.innerHTML=moreView();else if(page==='import')v.innerHTML=importView();else v.innerHTML=homeView()}
function homeView(){let due=contacts.filter(c=>dueToday(c)||overdue(c)).length, pending=countStatus('Pending');return `<div class="greeting"><div><div class="eyebrow">YOUR PRIVATE WORKSPACE</div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'} 👋</h1><div class="muted">Here’s your contact overview.</div></div><div class="privacy">🔒 Device-only</div></div>
<div class="grid stats"><div class="stat blue"><div class="s-icon">♙</div><strong>${nfmt(contacts.length)}</strong><small>Total contacts</small></div><div class="stat green"><div class="s-icon">☎</div><strong>${nfmt(contacts.reduce((n,c)=>n+(c.history||[]).filter(h=>h.kind==='Call').length,0))}</strong><small>Calls logged</small></div><div class="stat orange"><div class="s-icon">◷</div><strong>${nfmt(contacts.filter(c=>c.nextDate).length)}</strong><small>Follow-ups scheduled</small></div><div class="stat red"><div class="s-icon">!</div><strong>${nfmt(pending+contacts.filter(overdue).length)}</strong><small>Pending / overdue</small></div></div>
<div class="section"><div class="section-head"><h2>Quick actions</h2><span class="muted small">One tap away</span></div><div class="actions"><button class="action" onclick="openContact()"><span>＋</span>Add contact</button><button class="action green" onclick="go('contacts')"><span>◉</span>WhatsApp</button><button class="action purple" onclick="go('import')"><span>▤</span>Import file</button><button class="action orange" onclick="go('followups')"><span>◷</span>Follow-ups</button></div></div>
<div class="section"><div class="section-head"><h2>Today’s follow-ups</h2><button class="linkbtn" onclick="go('followups')">View all →</button></div>${contacts.filter(c=>dueToday(c)||overdue(c)).slice(0,5).map(c=>`<div class="task"><div class="task-icon">${overdue(c)?'!':'◷'}</div><div class="task-main"><b>${esc(c.name)}</b><small>${overdue(c)?'Overdue · ':''}${esc(c.nextDate||'')}</small></div><button class="secondary" onclick="showDetail(${c.id})">Open</button></div>`).join('')||`<div class="empty"><strong>No follow-ups due</strong>Add a next follow-up date to keep your day organized.</div>`}</div>
<div class="section"><div class="section-head"><h2>Contact status</h2><button class="linkbtn" onclick="go('analytics')">Analytics →</button></div>${[['Pending',countStatus('Pending')],['Contacted',countStatus('Contacted')],['Follow-up',countStatus('Follow-up')],['Interested',countStatus('Interested')]].map(([s,n])=>`<div class="barrow"><div class="barlabel">${s}</div><div class="bartrack"><div class="barfill" style="width:${contacts.length?Math.max(1,n/contacts.length*100):0}%"></div></div><div class="barval">${nfmt(n)}</div></div>`).join('')}</div>
${contacts.length===0?`<div class="notice">Start by importing your Excel/CSV contact list or add a contact manually. Your records stay in this browser on this device.</div>`:''}<div class="footer-note">ContactFlow · Private by design · No cloud database</div>`}
function contactsView(){let q=(document.getElementById('search')?.value??query).toLowerCase();query=q;let list=contacts.filter(c=>[c.name,c.phone,c.city,c.category,c.notes,(c.tags||[]).join(' ')].join(' ').toLowerCase().includes(q));if(activeFilter!=='All')list=list.filter(c=>status(c)===activeFilter);return `<div class="page-title"><div><div class="eyebrow">YOUR ADDRESS BOOK</div><h1>Contacts <span class="muted">(${nfmt(contacts.length)})</span></h1></div><button class="primary" onclick="openContact()">＋ Add</button></div><div class="searchrow"><input class="field" id="search" placeholder="Search name, phone, city, tags…" value="${esc(q)}" oninput="query=this.value;renderContactsOnly()"><button class="secondary" onclick="go('import')">⇧ Import</button></div><div class="filters">${['All','Pending','Contacted','Follow-up','Interested','Not Interested','Cold'].map(s=>`<button class="filter ${activeFilter===s?'active':''}" onclick="activeFilter='${s}';render()">${s}${s==='All'?' '+contacts.length:''}</button>`).join('')}</div><div class="section" id="contactresults">${list.length?list.slice(0,250).map(contactRow).join(''):`<div class="empty"><strong>No matching contacts</strong>Try another search or import your contact list.</div>`}${list.length>250?`<div class="muted small">Showing first 250 results. Refine your search to narrow the list.</div>`:''}</div>`}
function renderContactsOnly(){let inp=document.getElementById('search');let val=inp?.value||'';let active=document.activeElement===inp;let list=contacts.filter(c=>[c.name,c.phone,c.city,c.category,c.notes,(c.tags||[]).join(' ')].join(' ').toLowerCase().includes(val.toLowerCase()));if(activeFilter!=='All')list=list.filter(c=>status(c)===activeFilter);let r=document.getElementById('contactresults');if(r){r.innerHTML=list.length?list.slice(0,250).map(contactRow).join(''):`<div class="empty"><strong>No matching contacts</strong>Try another search.</div>`;if(active)document.getElementById('search')?.focus()}}
function followView(){let list=contacts.filter(c=>c.nextDate).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));return `<div class="page-title"><div><div class="eyebrow">STAY ON TOP OF IT</div><h1>Follow-ups</h1></div><button class="primary" onclick="openContact()">＋ Schedule</button></div><div class="grid metricrow"><div class="metric"><span class="muted small">Due today</span><b>${contacts.filter(dueToday).length}</b></div><div class="metric"><span class="muted small">Overdue</span><b>${contacts.filter(overdue).length}</b></div></div><div class="section"><div class="section-head"><h2>Scheduled contacts</h2><span class="muted small">${list.length} total</span></div>${list.length?list.map(c=>`<div class="task"><div class="task-icon">${overdue(c)?'!':dueToday(c)?'◷':'▣'}</div><div class="task-main"><b>${esc(c.name)}</b><small>${esc(c.nextDate)} · ${esc(c.nextAction||'Follow up')}</small></div><button class="secondary" onclick="showDetail(${c.id})">Open</button></div>`).join(''):`<div class="empty"><strong>No follow-ups scheduled</strong>Open a contact and add a follow-up date.</div>`}</div>`}
function templatesView(){return `<div class="page-title"><div><div class="eyebrow">WRITE ONCE, PERSONALIZE</div><h1>Message templates</h1></div><button class="primary" onclick="editTemplate()">＋ New</button></div><div class="notice">Use placeholders like <b>{name}</b>, <b>{phone}</b>, <b>{city}</b> and <b>{category}</b>. The app opens the chosen phone app; you review and send manually.</div>${templateList.map(t=>`<div class="template"><div class="template-head"><b>${esc(t.name)}</b><span class="pill ${t.channel==='WhatsApp'?'Contacted':'Follow-up'}">${esc(t.channel)}</span></div><p>${esc(t.body)}</p><div class="formactions"><button class="secondary" onclick="editTemplate('${t.id}')">Edit</button><button class="secondary" onclick="chooseTemplateContact('${t.id}')">Use with contact</button><button class="danger" onclick="deleteTemplate('${t.id}')">Delete</button></div></div>`).join('')}`}
function analyticsView(){let total=contacts.length;let activity={Call:0,WhatsApp:0,SMS:0,Note:0};contacts.forEach(c=>(c.history||[]).forEach(h=>{if(activity[h.kind]!==undefined)activity[h.kind]++}));return `<div class="page-title"><div><div class="eyebrow">YOUR ACTIVITY AT A GLANCE</div><h1>Analytics</h1></div><span class="privacy">🔒 Local data</span></div><div class="grid metricrow"><div class="metric"><span class="muted small">Total contacts</span><b>${nfmt(total)}</b></div><div class="metric"><span class="muted small">With follow-up</span><b>${nfmt(contacts.filter(c=>c.nextDate).length)}</b></div><div class="metric"><span class="muted small">Interested</span><b>${nfmt(countStatus('Interested'))}</b></div><div class="metric"><span class="muted small">Overdue</span><b>${nfmt(contacts.filter(overdue).length)}</b></div></div><div class="section"><h2>Contact status</h2>${['Pending','Contacted','Follow-up','Interested','Not Interested','Cold'].map(s=>{let n=countStatus(s);return `<div class="barrow"><div class="barlabel">${s}</div><div class="bartrack"><div class="barfill" style="width:${total?Math.max(n?2:0,n/total*100):0}%"></div></div><div class="barval">${nfmt(n)}</div></div>`}).join('')}</div><div class="section"><h2>Logged activity</h2>${Object.entries(activity).map(([k,n])=>`<div class="barrow"><div class="barlabel">${k}</div><div class="bartrack"><div class="barfill" style="width:${Math.max(0,n/(Math.max(1,...Object.values(activity)))*100)}%"></div></div><div class="barval">${nfmt(n)}</div></div>`).join('')}</div>`}
function moreView(){return `<div class="page-title"><div><div class="eyebrow">TOOLS & PREFERENCES</div><h1>More</h1></div></div><div class="section">${[['▤','Import Excel / CSV','go(\\'import\\')'],['⇩','Export contacts as CSV','exportCSV()'],['⬡','Create local backup','backup()'],['↻','Restore backup','document.getElementById(\\'importfile\\').accept=\\'.json\\';document.getElementById(\\'importfile\\').click()'],['▦','Analytics dashboard','go(\\'analytics\\')'],['♙','Find duplicate contacts','findDuplicates()'],['✉','Message templates','go(\\'templates\\')'],['⚙','App settings','settings()']].map(([i,t,a])=>`<div class="task" onclick="${a}" style="cursor:pointer"><div class="task-icon">${i}</div><div class="task-main"><b>${t}</b><small>${t.includes('backup')||t.includes('Restore')?'Saved only where you choose':'Manage your private contacts'}</small></div><span class="muted">›</span></div>`).join('')}</div><div class="section"><div class="privacybox"><b>🔒 Your data stays on this device</b><br>ContactFlow stores records in this browser’s IndexedDB. It does not upload contacts to a ContactFlow server. If browser data is cleared, your device is lost, or you use another browser, restore from a backup.</div></div><div class="section"><h2>Data management</h2><p class="muted small">You can clear all locally stored contacts. This cannot be undone unless you have a backup.</p><button class="danger" onclick="clearAll()">Delete all local contacts</button></div><div class="footer-note">ContactFlow v1 · Free-first · No CRM subscription</div>`}
function importView(){return `<div class="page-title"><div><div class="eyebrow">BULK IMPORT</div><h1>Import contacts</h1></div><button class="secondary" onclick="go('contacts')">Back</button></div><div class="section"><div style="font-size:40px;text-align:center;margin:8px">▤</div><h2 style="text-align:center">Choose Excel or CSV file</h2><p class="muted" style="text-align:center">Import 10,000+ rows in batches. CSV works offline; XLSX needs an internet connection to load the spreadsheet reader.</p><button class="primary" style="width:100%;margin:12px 0" onclick="document.getElementById('importfile').accept='.csv,.txt,.xlsx,.xls';document.getElementById('importfile').click()">Choose file</button><div id="importstatus" class="muted small"></div></div><div class="section"><h2>Recommended columns</h2><p class="muted small">Name, Phone / Mobile Number, City, Category, Status, Notes, Tags, Follow-up Date</p><div class="notice">Phone numbers are treated as text to preserve country codes. Duplicate phone numbers are skipped by default; review duplicate suggestions later.</div></div><div class="section"><h2>Import options</h2><label style="display:flex;gap:9px;align-items:center"><input type="checkbox" id="skipdupes" checked> Skip phone numbers already in contacts</label><label style="display:flex;gap:9px;align-items:center;margin-top:12px"><input type="checkbox" id="firstheader" checked> First row contains column headers</label></div>`}
function openContact(c=null){editId=c?.id||null;let x=c||{name:'',phone:'',city:'',category:'',status:'Pending',notes:'',tags:[],nextDate:'',nextAction:'Follow-up'};document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="modalclose" onclick="closeModal()">×</button><h2>${c?'Edit contact':'Add contact'}</h2><form onsubmit="submitContact(event)"><div class="formgrid"><div><label>Full name *</label><input class="field" name="name" required value="${esc(x.name)}" placeholder="Contact name"></div><div><label>Phone number *</label><input class="field" name="phone" required inputmode="tel" value="${esc(x.phone)}" placeholder="+91…"></div><div><label>City / District</label><input class="field" name="city" value="${esc(x.city)}" placeholder="City or district"></div><div><label>Category</label><input class="field" name="category" value="${esc(x.category)}" placeholder="Customer, student…"></div><div><label>Status</label><select class="field" name="status">${['Pending','Contacted','Follow-up','Interested','Not Interested','Cold'].map(s=>`<option ${status(x)===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Next follow-up date</label><input class="field" name="nextDate" type="date" value="${esc(x.nextDate||'')}"></div><div><label>Follow-up action</label><input class="field" name="nextAction" value="${esc(x.nextAction||'Follow-up')}"></div><div><label>Tags (comma separated)</label><input class="field" name="tags" value="${esc((x.tags||[]).join(', '))}" placeholder="priority, event"></div><div class="wide"><label>Notes</label><textarea class="field" name="notes" rows="3" placeholder="Context, preferences, next steps…">${esc(x.notes||'')}</textarea></div></div><div class="formactions"><button class="primary" type="submit">Save contact</button><button class="secondary" type="button" onclick="closeModal()">Cancel</button></div></form></div></div>`}
async function submitContact(e){e.preventDefault();let f=new FormData(e.target),x={name:f.get('name').trim(),phone:f.get('phone').trim(),city:f.get('city').trim(),category:f.get('category').trim(),status:f.get('status'),nextDate:f.get('nextDate'),nextAction:f.get('nextAction').trim(),tags:f.get('tags').split(',').map(x=>x.trim()).filter(Boolean),notes:f.get('notes').trim(),updatedAt:new Date().toISOString()};if(editId){let old=contacts.find(c=>c.id===editId);x={...old,...x,id:editId}}else{x.createdAt=new Date().toISOString();x.history=[]}await save(x);closeModal();toast('Contact saved');refresh()}
function closeModal(){document.getElementById('modalroot').innerHTML='';editId=null}
function showDetail(id){let c=contacts.find(x=>x.id===id);if(!c)return;document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="modalclose" onclick="closeModal()">×</button><div style="display:flex;gap:13px;align-items:center;margin:8px 0 18px"><div class="avatar" style="width:54px;height:54px;font-size:18px">${esc(initials(c.name))}</div><div><h2 style="margin:0">${esc(c.name)}</h2><div class="muted">${esc(c.phone)} · ${esc(c.city||'')}</div><span class="pill ${esc(status(c).replace(' ','-'))}">${esc(status(c))}</span></div></div><div class="actions"><button class="action" onclick="logAction(${id},'Call');location.href='${phoneHref(c)}'"><span>☎</span>Call</button><button class="action green" onclick="logAction(${id},'WhatsApp');window.open('${waHref(c)}','_blank')"><span>◉</span>WhatsApp</button><button class="action" onclick="logAction(${id},'SMS');location.href='${smsHref(c)}'"><span>▰</span>SMS</button><button class="action purple" onclick="closeModal();openContact(contacts.find(x=>x.id===${id}))"><span>✎</span>Edit</button></div><div class="section"><h2>Details</h2><p><b>Category:</b> ${esc(c.category||'—')}<br><b>Tags:</b> ${esc((c.tags||[]).join(', ')||'—')}<br><b>Next follow-up:</b> ${esc(c.nextDate||'Not scheduled')} ${esc(c.nextAction||'')}<br><b>Notes:</b><br>${esc(c.notes||'—')}</p><div class="formactions"><button class="secondary" onclick="setStatus(${id},'Contacted')">Mark contacted</button><button class="secondary" onclick="closeModal();openContact(contacts.find(x=>x.id===${id}))">Edit details</button><button class="danger" onclick="deleteContact(${id})">Delete</button></div></div><div class="section"><h2>Activity history</h2>${(c.history||[]).slice(0,20).map(h=>`<div class="task"><div class="task-icon">◷</div><div class="task-main"><b>${esc(h.kind)}</b><small>${esc(new Date(h.at).toLocaleString())}</small></div></div>`).join('')||'<div class="muted small">No activity logged yet.</div>'}</div></div></div>`}
async function setStatus(id,s){let c=contacts.find(x=>x.id===id);if(c){c.status=s;await save(c);closeModal();toast('Status updated');refresh()}}
async function deleteContact(id){if(!confirm('Delete this contact from this device?'))return;await del(id);closeModal();toast('Contact deleted');refresh()}
function editTemplate(id){let t=templateList.find(x=>x.id===id)||{id:'t'+Date.now(),name:'',channel:'WhatsApp',body:''};document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="modalclose" onclick="closeModal()">×</button><h2>${templateList.some(x=>x.id===id)?'Edit':'New'} template</h2><form onsubmit="saveTemplate(event,'${t.id}')"><label>Name</label><input class="field" name="name" required value="${esc(t.name)}"><label style="display:block;margin-top:10px">Channel</label><select class="field" name="channel"><option ${t.channel==='WhatsApp'?'selected':''}>WhatsApp</option><option ${t.channel==='SMS'?'selected':''}>SMS</option><option ${t.channel==='Call Script'?'selected':''}>Call Script</option></select><label style="display:block;margin-top:10px">Message</label><textarea class="field" name="body" rows="5" required>${esc(t.body)}</textarea><div class="formactions"><button class="primary">Save template</button></div></form></div></div>`}
function saveTemplate(e,id){e.preventDefault();let f=new FormData(e.target),t={id,name:f.get('name'),channel:f.get('channel'),body:f.get('body')};let i=templateList.findIndex(x=>x.id===id);if(i>=0)templateList[i]=t;else templateList.push(t);localStorage.setItem('cf_templates',JSON.stringify(templateList));closeModal();render()}
function deleteTemplate(id){if(confirm('Delete this template?')){templateList=templateList.filter(x=>x.id!==id);localStorage.setItem('cf_templates',JSON.stringify(templateList));render()}}
function chooseTemplateContact(id){let t=templateList.find(x=>x.id===id);document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="modalclose" onclick="closeModal()">×</button><h2>Use “${esc(t.name)}”</h2><input class="field" id="templsearch" placeholder="Find contact…" oninput="filterTemplateContacts('${id}')"><div id="templcontacts">${contacts.slice(0,80).map(c=>`<div class="contact"><div class="contactinfo"><b>${esc(c.name)}</b><small>${esc(c.phone)}</small></div><button class="secondary" onclick="useTemplate('${id}',${c.id})">Use</button></div>`).join('')}</div></div></div>`}
function filterTemplateContacts(id){let q=document.getElementById('templsearch').value.toLowerCase(),list=contacts.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(q)).slice(0,80);document.getElementById('templcontacts').innerHTML=list.map(c=>`<div class="contact"><div class="contactinfo"><b>${esc(c.name)}</b><small>${esc(c.phone)}</small></div><button class="secondary" onclick="useTemplate('${id}',${c.id})">Use</button></div>`).join('')}
function useTemplate(tid,cid){let t=templateList.find(x=>x.id===tid),c=contacts.find(x=>x.id===cid);if(!t||!c)return;let body=fillTemplate(t.body,c);if(t.channel==='WhatsApp'){logAction(cid,'WhatsApp');window.open(waHref(c,body),'_blank')}else if(t.channel==='SMS'){logAction(cid,'SMS');location.href=smsHref(c,body)}else{toast(body)}closeModal()}
function parseCSV(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let ch=text[i];if(ch==='"'&&q&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"')q=!q;else if(ch===','&&!q){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function rowToContact(row,headers){let get=(names)=>{let i=headers.findIndex(h=>names.some(n=>h.toLowerCase().replace(/[^a-z0-9]/g,'').includes(n)));return i>=0?String(row[i]||'').trim():''};let name=get(['name','fullname','contactname']);let phone=get(['phone','mobile','mobilenumber','telephone','whatsapp']);if(!name&&!phone)return null;return {name:name||'Unnamed',phone,city:get(['city','district','location']),category:get(['category','type','group']),status:get(['status'])||'Pending',notes:get(['notes','remark','comments']),tags:get(['tags','label']).split(/[,;]/).map(x=>x.trim()).filter(Boolean),nextDate:get(['followupdate','nextdate','reminderdate']),nextAction:get(['nextaction','followupaction'])||'Follow-up',history:[],createdAt:new Date().toISOString()}}
document.getElementById('importfile').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;let stat=document.getElementById('importstatus');if(stat)stat.textContent='Reading '+file.name+'…';try{let rows;if(file.name.toLowerCase().endsWith('.json')){let obj=JSON.parse(await file.text());let list=Array.isArray(obj)?obj:obj.contacts;if(!Array.isArray(list))throw Error('Backup JSON must contain a contacts array.');let added=0;for(let c of list){let {id,...x}=c;await save(x);added++}if(obj.templates){templateList=obj.templates;localStorage.setItem('cf_templates',JSON.stringify(templateList))}toast('Restored '+added+' contacts');refresh();go('contacts');return}else if(/\.xlsx?$/.test(file.name.toLowerCase())){if(!window.XLSX){await loadSheetJS()}let data=await file.arrayBuffer(),wb=XLSX.read(data,{type:'array'});rows=XLSX.utils.sheet_to_json(wb,{header:1,defval:''})}else rows=parseCSV(await file.text());if(!rows.length)throw Error('No rows found');let has=document.getElementById('firstheader')?.checked??true,headers=(has?rows.shift():rows[0]).map(x=>String(x||'').trim().toLowerCase());if(!has)headers=headers.map((_,i)=>['name','phone','city','category','status','notes','tags','nextdate'][i]||'column'+i);let seen=new Set(contacts.map(c=>normalizePhone(c.phone)).filter(Boolean)),added=0,skipped=0;for(let row of rows){let c=rowToContact(row,headers);if(!c)continue;let p=normalizePhone(c.phone);if(document.getElementById('skipdupes')?.checked&&p&&seen.has(p)){skipped++;continue}if(p)seen.add(p);await save(c);added++}toast(`Imported ${added}; skipped ${skipped} duplicates`);refresh();go('contacts')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value='';let s=document.getElementById('importstatus');if(s)s.textContent=''}}
);
function loadSheetJS(){return new Promise((res,rej)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=res;s.onerror=()=>rej(Error('Could not load Excel reader. Try exporting the sheet as CSV, which works offline.'));document.head.appendChild(s)})}
function csvCell(v){let s=String(v??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCSV(){let heads=['Name','Phone','City','Category','Status','Notes','Tags','Follow-up Date','Follow-up Action','Last Contact'];let rows=contacts.map(c=>[c.name,c.phone,c.city,c.category,status(c),c.notes,(c.tags||[]).join(';'),c.nextDate,c.nextAction,c.lastContact]);let text=[heads,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');download(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}),'contactflow-contacts.csv');toast('CSV export ready')}
function backup(){let data={app:'ContactFlow',version:1,exportedAt:new Date().toISOString(),contacts,templates:templateList};download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'contactflow-backup.json');toast('Backup file created')}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function findDuplicates(){let groups={},dupes=[];contacts.forEach(c=>{let p=normalizePhone(c.phone);if(!p)return;(groups[p]||(groups[p]=[])).push(c)});Object.entries(groups).forEach(([p,a])=>{if(a.length>1)dupes.push({phone:p,items:a})});document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="modalclose" onclick="closeModal()">×</button><h2>Possible duplicates</h2><p class="muted small">Matched by normalized phone number. Review before deleting anything.</p>${dupes.length?dupes.map(g=>`<div class="template"><b>${esc(g.phone)}</b>${g.items.map(c=>`<div class="task"><div class="contactinfo"><b>${esc(c.name)}</b><small>${esc(c.city||'')}</small></div><button class="secondary" onclick="closeModal();showDetail(${c.id})">Review</button></div>`).join('')}</div>`).join(''):'<div class="empty"><strong>No duplicate phone numbers found</strong>Your contacts look clear.</div>'}</div></div>`}
function settings(){document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="modalclose" onclick="closeModal()">×</button><h2>App settings</h2><div class="privacybox">🔒 Contact data remains in this browser's IndexedDB. This is local storage, not encryption. Anyone with access to your unlocked device/browser profile may be able to access it.</div><p class="muted small">Recommended: use your phone's screen lock, don't share the browser profile, and create a backup regularly.</p><button class="primary" onclick="backup()">Create backup now</button></div></div>`}
async function clearAll(){if(!confirm('Permanently delete all '+contacts.length+' contacts from this device? Make a backup first if needed.'))return;let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).clear();t.oncomplete=()=>{toast('Local contacts cleared');refresh()}}
async function init(){try{await openDB();templateList=JSON.parse(localStorage.getItem('cf_templates')||'null')||templateList;refresh()}catch(e){document.getElementById('view').innerHTML='<div class="section"><h2>Storage unavailable</h2><p>Please open this app in a modern browser with site storage enabled.</p></div>'}}
init();
</script></body></html>
