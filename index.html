
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fc">
<title>Riviraa Desk — Private Contact Manager</title>
<style>
:root{--blue:#1769f5;--navy:#17233f;--muted:#71809c;--bg:#f5f7fc;--line:#e5eaf3;--green:#10a66a;--orange:#f59e0b;--red:#e84d70}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:14px/1.5 system-ui,-apple-system,Segoe UI,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 13px;font-weight:700}.primary{background:var(--blue);color:white}.secondary{background:#eef3fc;color:#344562;border:1px solid var(--line)}.danger{background:#fff0f3;color:#c92b50}.app{max-width:1120px;margin:auto;min-height:100vh;padding-bottom:80px}.top{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:13px 18px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:850;letter-spacing:-.6px}.logo{background:linear-gradient(140deg,#1769f5,#77a7ff);color:white;width:38px;height:38px;border-radius:13px;display:grid;place-items:center}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:0}.topactions{display:flex;gap:7px}.main{max-width:950px;margin:auto;padding:18px}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:7px 0 18px}.heading h1{font-size:26px;margin:2px 0;letter-spacing:-.7px}.eyebrow{font-size:10px;color:var(--blue);font-weight:850;letter-spacing:1.5px}.muted,small{color:var(--muted)}.privacy{font-size:11px;background:#e8fbf2;color:#08794b;border-radius:30px;padding:7px 10px;font-weight:800;white-space:nowrap}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.card,.stat{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 5px 22px #20385b08}.stat strong{display:block;font-size:27px;line-height:1.3}.stat small{font-size:12px}.stat .ico{font-size:20px;margin-bottom:8px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.sectionhead h2{margin:0;font-size:16px}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.action{background:#eef4ff;color:var(--blue);padding:12px 3px;font-size:11px;display:flex;align-items:center;flex-direction:column;gap:6px}.action span{font-size:21px}.action.green{background:#e8fbf2;color:#078651}.action.orange{background:#fff5df;color:#ad7100}.action.purple{background:#f0ecff;color:#7657f6}.field{width:100%;padding:11px 12px;border:1px solid #dce4f1;border-radius:11px;background:white;color:var(--navy);outline:none;min-width:0}.field:focus{border-color:#82aaff;box-shadow:0 0 0 3px #1769f515}label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px}.formgrid{display:grid;grid-template-columns:1fr;gap:12px}.wide{grid-column:1/-1}.formactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.searchrow{display:flex;gap:8px;margin-bottom:10px}.filters{display:flex;gap:7px;overflow:auto;margin:10px 0 14px}.filter{background:#eaf0fa;color:#60708b;border-radius:30px;padding:8px 12px;white-space:nowrap;font-size:11px}.filter.active{background:var(--blue);color:white}.contact{display:flex;gap:10px;align-items:center;border-top:1px solid #f0f2f7;padding:12px 0}.avatar{flex-shrink:0;width:42px;height:42px;border-radius:14px;background:#e8efff;color:var(--blue);display:grid;place-items:center;font-weight:850}.cinfo{flex:1;min-width:0;cursor:pointer}.cinfo b,.cinfo small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cinfo small{font-size:11px}.tools{display:flex;gap:4px}.mini{padding:7px 9px;background:#eef4ff;color:var(--blue)}.mini.green{background:#e8fbf2;color:#078651}.pill{display:inline-block;border-radius:30px;padding:3px 8px;font-size:10px;font-weight:800;background:#edf1f7;color:#65728b}.pill.Pending{background:#fff0f3;color:#c92b50}.pill.Contacted{background:#e8fbf2;color:#08794b}.pill.Interested{background:#f0ecff;color:#7657f6}.pill.Follow-up{background:#fff5df;color:#ad7100}.pill.Cold{background:#edf1f7;color:#65728b}.empty{text-align:center;padding:28px 10px;color:var(--muted)}.empty b{display:block;color:var(--navy);margin-bottom:5px}.task{display:flex;align-items:center;gap:10px;border-top:1px solid #f0f2f7;padding:12px 0}.task:first-of-type{border-top:0}.taskicon{width:36px;height:36px;border-radius:12px;background:#fff5df;display:grid;place-items:center}.taskbody{flex:1;min-width:0}.taskbody b,.taskbody small{display:block}.taskbody small{font-size:11px}.bottom{position:fixed;z-index:8;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center}.navinner{width:min(700px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav{background:transparent;color:#8994a9;font-size:10px;padding:5px 1px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav span{font-size:19px}.nav.active{background:#eaf2ff;color:var(--blue)}.notice{padding:12px;background:#fff9e9;border:1px solid #f2dfae;border-radius:13px;font-size:12px;color:#765311}.goodnotice{padding:13px;background:#e8fbf2;border-radius:13px;color:#08794b;font-size:12px}.template{border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0}.template p{white-space:pre-wrap;font-size:12px;color:#596780}.metricgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{background:#f4f7fc;border-radius:13px;padding:13px}.metric b{font-size:22px;display:block}.barrow{display:flex;gap:8px;align-items:center;margin:12px 0}.barlabel{width:100px;font-size:12px}.bartrack{height:8px;flex:1;background:#eaf0fa;border-radius:20px;overflow:hidden}.barfill{height:100%;background:var(--blue)}.barvalue{width:30px;text-align:right;font-size:11px}.modalback{position:fixed;inset:0;z-index:20;background:#101a2c77;display:flex;align-items:flex-end;justify-content:center;padding:10px}.modal{background:white;border-radius:22px 22px 12px 12px;padding:20px;width:min(650px,100%);max-height:90vh;overflow:auto}.modal h2{margin-top:0}.close{float:right;background:#edf1f7;padding:5px 10px}.hidden{display:none!important}.toast{position:fixed;z-index:30;bottom:90px;left:50%;transform:translateX(-50%);background:#17233f;color:white;border-radius:12px;padding:11px 16px;max-width:90%;font-size:12px}.footer{text-align:center;font-size:10px;color:#9aa5b8;padding:14px}
@media(min-width:650px){.main{padding:25px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.formgrid{grid-template-columns:1fr 1fr}.bottom{top:66px;bottom:auto;left:auto;right:max(0px,calc((100% - 1120px)/2));border:1px solid var(--line);border-radius:0 0 0 15px;padding:5px 10px}.navinner{width:370px}.app{padding-bottom:20px}.modalback{align-items:center}.modal{border-radius:20px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><div class="logo">✦</div><div>Riviraa <span style="color:#1769f5">Desk</span><small>Private Contact Manager</small></div></div>
 <div class="topactions"><button class="secondary" onclick="go('contacts')">⌕ Search</button><button class="primary" onclick="openContact()">＋ Add</button></div>
</header>
<main class="main" id="view"></main>
<nav class="bottom"><div class="navinner">
<button class="nav active" data-page="home" onclick="go('home')"><span>⌂</span>Home</button>
<button class="nav" data-page="contacts" onclick="go('contacts')"><span>♙</span>Contacts</button>
<button class="nav" data-page="followups" onclick="go('followups')"><span>◷</span>Follow-ups</button>
<button class="nav" data-page="templates" onclick="go('templates')"><span>✉</span>Templates</button>
<button class="nav" data-page="more" onclick="go('more')"><span>☷</span>More</button>
</div></nav>
<div id="modalroot"></div><div id="toastroot"></div>
<input id="importfile" class="hidden" type="file" accept=".csv,.xlsx,.xls,.json">
</div>
<script>
'use strict';
const DB='contactflow-premium-v1', STORE='contacts';
let db,contacts=[],page='home',activeFilter='All',editingId=null;
let templates=JSON.parse(localStorage.getItem('cf_templates')||'null')||[
{name:'Masters Games Invitation',channel:'WhatsApp',body:'Hello {name}! 🏆 You are invited to the 15th State Masters Games 2026–27 on 14–15 November 2026 at Bilaspur, Himachal Pradesh. Reply for registration details.'},
{name:'Follow-up Reminder',channel:'WhatsApp',body:'Hello {name}, following up regarding {category}. Please let me know a convenient time to connect. Thank you!'},
{name:'General Introduction',channel:'SMS',body:'Hello {name}, thank you for connecting. Please save this number for future updates.'}
];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').toLowerCase().trim().replace(/\s+/g,' ')}
function phoneNorm(s){return String(s||'').replace(/\D/g,'').replace(/^0+/,'')}
function st(c){return c.status||'Pending'}
function toast(s){let el=document.getElementById('toastroot');el.innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>el.innerHTML='',2800)}
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(STORE)){let s=d.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});s.createIndex('phone','phone',{unique:false})}};r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)})}
function getAll(){return new Promise((resolve,reject)=>{let r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function put(c){return new Promise((resolve,reject)=>{let tx=db.transaction(STORE,'readwrite'),s=tx.objectStore(STORE);c.updatedAt=new Date().toISOString();let r;if(c.id)r=s.put(c);else{c.createdAt=new Date().toISOString();r=s.add(c)}r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function del(id){return new Promise((resolve,reject)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(Number(id));r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
async function refresh(){contacts=await getAll();render()}
function go(p){page=p;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));render();window.scrollTo(0,0)}
function render(){let v=document.getElementById('view');if(page==='home')v.innerHTML=homeView();if(page==='contacts')v.innerHTML=contactsView();if(page==='followups')v.innerHTML=followView();if(page==='templates')v.innerHTML=templateView();if(page==='more')v.innerHTML=moreView();if(page==='import')v.innerHTML=importView();if(page==='analytics')v.innerHTML=analyticsView()}
function heading(k,t,sub,button=''){return '<div class="heading"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><div class="muted">'+(sub||'')+'</div></div>'+button+'</div>'}
function homeView(){let today=new Date().toISOString().slice(0,10),due=contacts.filter(c=>c.nextDate&&c.nextDate<=today),pending=contacts.filter(c=>st(c)==='Pending').length;return heading('YOUR WORKSPACE','Welcome back','Your contacts. Your control.','<span class="privacy">🔒 Local & private</span>')+
'<div class="grid stats"><div class="stat"><div class="ico">♙</div><strong>'+contacts.length.toLocaleString('en-IN')+'</strong><small>Total contacts</small></div><div class="stat"><div class="ico">✓</div><strong>'+contacts.filter(c=>st(c)==='Contacted').length+'</strong><small>Contacted</small></div><div class="stat"><div class="ico">◷</div><strong>'+due.length+'</strong><small>Follow-ups due</small></div><div class="stat"><div class="ico">!</div><strong>'+pending+'</strong><small>Pending</small></div></div>'+
'<div class="card"><div class="sectionhead"><h2>Quick actions</h2></div><div class="actions"><button class="action" onclick="openContact()"><span>＋</span>Add contact</button><button class="action green" onclick="go(\'import\')"><span>⇧</span>Import Excel</button><button class="action purple" onclick="exportExcel()"><span>▦</span>Export Excel</button><button class="action orange" onclick="backup()"><span>⬡</span>Backup</button></div></div>'+
'<div class="card"><div class="sectionhead"><h2>Upcoming follow-ups</h2><button class="secondary" onclick="go(\'followups\')">View all →</button></div>'+(due.length?due.slice(0,5).map(c=>'<div class="task"><div class="taskicon">◷</div><div class="taskbody"><b>'+esc(c.name)+'</b><small>'+esc(c.nextDate)+' · '+esc(c.nextAction||'Follow-up')+'</small></div><button class="secondary" onclick="detail('+c.id+')">Open</button></div>').join(''):'<div class="empty"><b>No follow-ups due</b>Add a follow-up date to a contact to see reminders here.</div>')+'</div>'+
(contacts.length?'':'<div class="notice">Start by adding a contact or importing your existing Excel/CSV list. Export a backup regularly to protect your records.</div>')+'<div class="footer">Riviraa Desk · Private by design · Local browser storage</div>'}
function contactsView(){let q=(document.getElementById('searchbox')?.value||'').toLowerCase();let list=contacts.filter(c=>(activeFilter==='All'||st(c)===activeFilter)&&[c.name,c.phone,c.city,c.state,c.game,c.category,c.tags,c.notes].join(' ').toLowerCase().includes(q));return heading('YOUR DATABASE','Contacts',contacts.length+' saved contacts','<button class="primary" onclick="openContact()">＋ Add</button>')+
'<div class="searchrow"><input class="field" id="searchbox" placeholder="Search name, phone, district, game…" value="'+esc(q)+'" oninput="render()"><button class="secondary" onclick="go(\'import\')">Import</button></div><div class="filters">'+['All','Pending','Contacted','Follow-up','Interested','Cold'].map(s=>'<button class="filter '+(activeFilter===s?'active':'')+'" onclick="activeFilter='+JSON.stringify(s)+';render()">'+s+'</button>').join('')+'</div><div class="card">'+(list.length?list.map(c=>contactRow(c)).join(''):'<div class="empty"><b>No contacts found</b>Try another search or add a contact.</div>')+'</div>'}
function contactRow(c){return '<div class="contact"><div class="avatar">'+esc((c.name||'?').slice(0,1).toUpperCase())+'</div><div class="cinfo" onclick="detail('+c.id+')"><b>'+esc(c.name)+'</b><small>'+esc(c.phone)+' · '+esc(c.city||c.state||'')+'</small><small><span class="pill '+esc(st(c))+'">'+esc(st(c))+'</span> '+esc(c.game||c.category||'')+'</small></div><div class="tools"><button class="mini" title="Call" onclick="callC('+c.id+')">☎</button><button class="mini green" title="WhatsApp" onclick="waC('+c.id+')">◉</button></div></div>'}
function followView(){let today=new Date().toISOString().slice(0,10),list=contacts.filter(c=>c.nextDate).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));return heading('STAY CONNECTED','Follow-ups','Planned calls and reminders')+'<div class="card">'+(list.length?list.map(c=>'<div class="task"><div class="taskicon">◷</div><div class="taskbody"><b>'+esc(c.name)+'</b><small>'+esc(c.nextDate)+' · '+esc(c.nextAction||'Follow-up')+'</small></div><span class="pill '+(c.nextDate<today?'Pending':'Follow-up')+'">'+(c.nextDate<today?'Overdue':c.nextDate===today?'Today':'Upcoming')+'</span><button class="secondary" onclick="detail('+c.id+')">Open</button></div>').join(''):'<div class="empty"><b>No follow-ups scheduled</b>Open a contact and add a date.</div>')+'</div>'}
function openContact(id){editingId=id||null;let c=contacts.find(x=>x.id===id)||{};let fields=[['name','Full name *',c.name,'text'],['phone','Phone number *',c.phone,'tel'],['city','City / District',c.city,'text'],['state','State',c.state,'text'],['dob','Date of birth',c.dob,'date'],['age','Age',c.age,'number'],['gender','M / F',c.gender,'select'],['game','Game participation',c.game,'text'],['category','Category',c.category,'text'],['status','Status',st(c),'select-status'],['nextDate','Next follow-up date',c.nextDate,'date'],['nextAction','Follow-up action',c.nextAction,'text'],['tags','Tags (comma separated)',c.tags,'text'],['notes','Notes',c.notes,'textarea']];let html='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h2>'+(id?'Edit contact':'Add contact')+'</h2><form onsubmit="saveForm(event)"><div class="formgrid">'+fields.map(([key,label,val,type])=>'<div class="'+(['notes'].includes(key)?'wide':'')+'"><label for="f_'+key+'">'+label+'</label>'+(type==='select'?'<select class="field" id="f_'+key+'"><option value="">Select</option><option '+(val==='M'?'selected':'')+'>M</option><option '+(val==='F'?'selected':'')+'>F</option><option '+(val==='Other'?'selected':'')+'>Other</option></select>':type==='select-status'?'<select class="field" id="f_'+key+'">'+['Pending','Contacted','Follow-up','Interested','Cold'].map(s=>'<option '+(val===s?'selected':'')+'>'+s+'</option>').join('')+'</select>':type==='textarea'?'<textarea class="field" id="f_'+key+'" rows="3">'+esc(val||'')+'</textarea>':'<input class="field" id="f_'+key+'" type="'+type+'" value="'+esc(val||'')+'" '+(['name','phone'].includes(key)?'required':'')+'>')+'</div>').join('')+'</div><div class="formactions"><button class="primary" type="submit">Save contact</button><button class="secondary" type="button" onclick="closeModal()">Cancel</button></div></form></div></div>';document.getElementById('modalroot').innerHTML=html}
function closeModal(){document.getElementById('modalroot').innerHTML=''}
async function saveForm(e){e.preventDefault();let c={};['name','phone','city','state','dob','age','gender','game','category','status','nextDate','nextAction','tags','notes'].forEach(k=>c[k]=document.getElementById('f_'+k).value.trim());c.age=c.age?Number(c.age):'';if(editingId)c.id=editingId;let dup=contacts.find(x=>phoneNorm(x.phone)===phoneNorm(c.phone)&&x.id!==c.id&&phoneNorm(c.phone));if(dup&&!confirm('A contact with this phone number already exists: '+dup.name+'. Save anyway?'))return;try{await put(c);closeModal();await refresh();toast('Contact saved successfully')}catch(err){toast('Could not save contact: '+err.message)}}
function detail(id){let c=contacts.find(x=>x.id===id);if(!c)return;document.getElementById('modalroot').innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h2>'+esc(c.name)+'</h2><p><span class="pill '+esc(st(c))+'">'+esc(st(c))+'</span></p><div class="card">'+[['Phone',c.phone],['City / District',c.city],['State',c.state],['Date of birth',c.dob],['Age',c.age],['Gender',c.gender],['Game',c.game],['Category',c.category],['Follow-up',c.nextDate],['Action',c.nextAction],['Tags',c.tags],['Notes',c.notes]].filter(x=>x[1]).map(x=>'<p><small>'+x[0]+'</small><br><b>'+esc(x[1])+'</b></p>').join('')+'</div><div class="formactions"><button class="primary" onclick="closeModal();openContact('+c.id+')">Edit</button><button class="secondary" onclick="callC('+c.id+')">Call</button><button class="secondary" onclick="waC('+c.id+')">WhatsApp</button><button class="secondary" onclick="closeModal();copyContact('+c.id+')">Copy details</button><button class="danger" onclick="deleteC('+c.id+')">Delete</button></div></div></div>'}
function callC(id){let c=contacts.find(x=>x.id===id);if(c?.phone)location.href='tel:'+c.phone}
function waC(id){let c=contacts.find(x=>x.id===id);if(c?.phone)window.open('https://wa.me/'+phoneNorm(c.phone),'_blank','noopener')}
function copyContact(id){let c=contacts.find(x=>x.id===id);if(c)navigator.clipboard?.writeText(Object.entries(c).map(([k,v])=>k+': '+v).join('\n')).then(()=>toast('Contact details copied')).catch(()=>toast('Copy not available in this browser'))}
async function deleteC(id){if(!confirm('Delete this contact? This cannot be undone without a backup.'))return;await del(id);closeModal();await refresh();toast('Contact deleted')}
function templateView(){return heading('COMMUNICATION','Message templates','Use placeholders like {name}, {phone}, {city}, {game}, {category}.','<button class="primary" onclick="addTemplate()">＋ New</button>')+'<div class="card">'+templates.map((t,i)=>'<div class="template"><div class="sectionhead"><div><b>'+esc(t.name)+'</b><br><small>'+esc(t.channel)+'</small></div><button class="secondary" onclick="editTemplate('+i+')">Edit</button></div><p>'+esc(t.body)+'</p><button class="primary" onclick="copyTemplate('+i+')">Copy message</button> <button class="secondary" onclick="sendTemplate('+i+')">Use with contact</button> <button class="danger" onclick="removeTemplate('+i+')">Delete</button></div>').join('')+'</div>'}
function saveTemplates(){localStorage.setItem('cf_templates',JSON.stringify(templates))}
function addTemplate(){editTemplate(-1)}
function editTemplate(i){let t=i<0?{name:'',channel:'WhatsApp',body:''}:templates[i];document.getElementById('modalroot').innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h2>'+(i<0?'New template':'Edit template')+'</h2><form onsubmit="saveTemplateForm(event,'+i+')"><label>Name</label><input id="tname" class="field" required value="'+esc(t.name)+'"><br><br><label>Channel</label><select id="tchannel" class="field"><option '+(t.channel==='WhatsApp'?'selected':'')+'>WhatsApp</option><option '+(t.channel==='SMS'?'selected':'')+'>SMS</option><option '+(t.channel==='Email'?'selected':'')+'>Email</option></select><br><br><label>Message</label><textarea id="tbody" class="field" rows="6" required>'+esc(t.body)+'</textarea><div class="formactions"><button class="primary">Save template</button></div></form></div></div>'}
function saveTemplateForm(e,i){e.preventDefault();let t={name:document.getElementById('tname').value,channel:document.getElementById('tchannel').value,body:document.getElementById('tbody').value};if(i<0)templates.push(t);else templates[i]=t;saveTemplates();closeModal();render();toast('Template saved')}
function removeTemplate(i){if(confirm('Delete this template?')){templates.splice(i,1);saveTemplates();render()}}
async function copyTemplate(i){let t=templates[i];try{await navigator.clipboard.writeText(t.body);toast('Template copied')}catch(e){toast('Clipboard not available; open Edit to copy text')}}
function sendTemplate(i){if(!contacts.length){toast('Add or import a contact first');return}let options=contacts.map(c=>'<option value="'+c.id+'">'+esc(c.name)+' — '+esc(c.phone)+'</option>').join('');document.getElementById('modalroot').innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h2>Use template</h2><label>Choose contact</label><select class="field" id="templateContact">'+options+'</select><div class="formactions"><button class="primary" onclick="renderTemplate('+i+')">Preview message</button></div><div id="templatePreview"></div></div></div>'}
function renderTemplate(i){let c=contacts.find(x=>x.id===Number(document.getElementById('templateContact').value)),body=templates[i].body;Object.entries({name:c.name,phone:c.phone,city:c.city,state:c.state,game:c.game,category:c.category}).forEach(([k,v])=>body=body.replaceAll('{'+k+'}',v||''));document.getElementById('templatePreview').innerHTML='<textarea class="field" id="renderedMessage" rows="6">'+esc(body)+'</textarea><div class="formactions"><button class="primary" onclick="copyRendered()">Copy message</button><button class="secondary" onclick="openWhatsAppMessage()">Open WhatsApp</button></div>'}
async function copyRendered(){try{await navigator.clipboard.writeText(document.getElementById('renderedMessage').value);toast('Message copied')}catch(e){toast('Select and copy the message manually')}}
function openWhatsAppMessage(){let c=contacts.find(x=>x.id===Number(document.getElementById('templateContact').value));window.open('https://wa.me/'+phoneNorm(c.phone)+'?text='+encodeURIComponent(document.getElementById('renderedMessage').value),'_blank','noopener')}
function importView(){return heading('DATA MANAGEMENT','Import contacts','Import your existing spreadsheet')+'<div class="card"><h2>Excel / CSV import</h2><p class="muted">Supports the columns in your existing sheet: Sr. No., Full Name, State, Date of Birth, Age, M / F, Phone Number, Game Participation. Also recognises City/District, Status, Category, Follow-up date, Tags and Notes.</p><div class="notice">For .xlsx/.xls files, this page loads SheetJS from a public CDN, so internet is needed for Excel parsing. CSV works without that library.</div><br><button class="primary" onclick="document.getElementById(\'importfile\').accept=\'.csv,.xlsx,.xls\';document.getElementById(\'importfile\').click()">Choose Excel / CSV file</button> <button class="secondary" onclick="downloadTemplate()">Download CSV template</button><br><br><div id="importresult"></div></div><div class="card"><h2>Important</h2><p class="muted">Importing adds records; it does not automatically delete existing contacts. Duplicate phone numbers are skipped by default.</p></div>'}
function moreView(){return heading('TOOLS & PREFERENCES','More','Backup, analytics and data tools')+'<div class="card">'+[['⇧','Import Excel / CSV',"go('import')"],['⇩','Export CSV','exportCSV()'],['▦','Export Excel workbook','exportExcel()'],['⬡','Download JSON backup','backup()'],['↻','Restore JSON backup','restorePick()'],['▦','Analytics dashboard',"go('analytics')"],['♙','Find duplicate contacts','findDuplicates()'],['⚙','Storage information','storageInfo()']].map(a=>'<div class="task" style="cursor:pointer" onclick="'+a[2]+'"><div class="taskicon">'+a[0]+'</div><div class="taskbody"><b>'+a[1]+'</b><small>Manage your local records</small></div><span>›</span></div>').join('')+'</div><div class="card"><div class="goodnotice"><b>🔒 Local-first privacy</b><br>Your contact records are stored in this browser’s IndexedDB, not uploaded to a Riviraa server. Export a backup regularly and keep it somewhere safe.</div></div><div class="card"><h2>Delete all contacts</h2><p class="muted">This removes contacts stored in this browser. It cannot be undone without a backup.</p><button class="danger" onclick="clearAll()">Delete all contacts</button></div><div class="footer">Riviraa Desk · Free-first · No CRM subscription</div>'}
function analyticsView(){let counts={};contacts.forEach(c=>counts[st(c)]=(counts[st(c)]||0)+1);let games={};contacts.forEach(c=>{if(c.game)games[c.game]=(games[c.game]||0)+1});let max=Math.max(1,...Object.values(games));return heading('INSIGHTS','Analytics','Overview of your contact database')+'<div class="metricgrid"><div class="metric"><small>Total contacts</small><b>'+contacts.length+'</b></div><div class="metric"><small>With phone numbers</small><b>'+contacts.filter(c=>c.phone).length+'</b></div><div class="metric"><small>With follow-up dates</small><b>'+contacts.filter(c=>c.nextDate).length+'</b></div><div class="metric"><small>Game categories</small><b>'+Object.keys(games).length+'</b></div></div><div class="card"><h2>Status breakdown</h2>'+['Pending','Contacted','Follow-up','Interested','Cold'].map(s=>'<div class="barrow"><div class="barlabel">'+s+'</div><div class="bartrack"><div class="barfill" style="width:'+(contacts.length?100*(counts[s]||0)/contacts.length:0)+'%"></div></div><div class="barvalue">'+(counts[s]||0)+'</div></div>').join('')+'</div><div class="card"><h2>Game participation</h2>'+(Object.keys(games).length?Object.entries(games).sort((a,b)=>b[1]-a[1]).slice(0,20).map(([g,n])=>'<div class="barrow"><div class="barlabel">'+esc(g)+'</div><div class="bartrack"><div class="barfill" style="width:'+(100*n/max)+'%"></div></div><div class="barvalue">'+n+'</div></div>').join(''):'<div class="empty">No game participation data yet.</div>')+'</div>'}
function download(name,content,type='text/plain;charset=utf-8'){let b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function csvCell(v){let s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}
const COLS=[['Sr. No.','sr'],['Full Name','name'],['State','state'],['Date of Birth','dob'],['Age','age'],['M / F','gender'],['Phone Number','phone'],['Game Participation','game'],['City / District','city'],['Category','category'],['Status','status'],['Next Follow-up Date','nextDate'],['Follow-up Action','nextAction'],['Tags','tags'],['Notes','notes']];
function exportCSV(){let rows=[COLS.map(x=>x[0]),...contacts.map((c,i)=>COLS.map(([label,k])=>k==='sr'?i+1:k==='status'?st(c):c[k]??''))];download('Riviraa-Desk-Contacts.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV export downloaded')}
function exportExcel(){if(!window.XLSX){toast('Loading Excel library…');loadXLSX().then(exportExcel).catch(()=>toast('Excel export needs internet. Use CSV export instead.'));return}let data=[COLS.map(x=>x[0]),...contacts.map((c,i)=>COLS.map(([label,k])=>k==='sr'?i+1:k==='status'?st(c):c[k]??''))];let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(data),'Contacts');let act=[['Contact ID','Full Name','Phone','Status','Next Follow-up','Last Updated'],...contacts.map(c=>[c.id,c.name,c.phone,st(c),c.nextDate||'',c.updatedAt||''])];XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(act),'Contact Summary');XLSX.writeFile(wb,'Riviraa-Desk-Contacts.xlsx');toast('Excel workbook downloaded')}
function backup(){download('Riviraa-Desk-Backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'Riviraa Desk',version:1,exportedAt:new Date().toISOString(),contacts,templates},null,2),'application/json');toast('Backup downloaded')}
function downloadTemplate(){let rows=[COLS.map(x=>x[0]),['1','Sample Contact','Himachal Pradesh','1990-01-01','36','M','9876543210','Athletics','Bilaspur','Masters Games','Pending','','','','']];download('Riviraa-Desk-Excel-Template.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function restorePick(){document.getElementById('importfile').accept='.json';document.getElementById('importfile').click()}
function storageInfo(){alert('Contacts stored locally: '+contacts.length+'\nDatabase: '+DB+'\nStorage: Browser IndexedDB\n\nKeep regular backups. Clearing browser site data can delete local contacts.')}
async function clearAll(){if(!confirm('Are you sure you want to permanently delete ALL '+contacts.length+' contacts from this browser? Download a backup first if needed.'))return;if(!confirm('Final confirmation: delete all local contacts?'))return;await new Promise((resolve,reject)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).clear();r.onsuccess=resolve;r.onerror=()=>reject(r.error)});await refresh();toast('Local contacts deleted')}
function findDuplicates(){let groups={};contacts.forEach(c=>{let p=phoneNorm(c.phone);if(p)(groups[p]||(groups[p]=[])).push(c)});let dup=Object.entries(groups).filter(([p,a])=>a.length>1);let html=heading('DATA QUALITY','Duplicate checker',dup.length+' duplicate phone groups found')+'<div class="card">'+(dup.length?dup.map(([p,a])=>'<div class="template"><b>'+esc(p)+'</b>'+a.map(c=>'<p>'+esc(c.name)+' — '+esc(c.phone)+' <button class="secondary" onclick="detail('+c.id+')">Open</button></p>').join('')+'</div>').join(''):'<div class="empty"><b>No duplicate phone numbers found</b>Your contacts look good.</div>')+'</div>';document.getElementById('view').innerHTML=html}
function loadXLSX(){return new Promise((resolve,reject)=>{if(window.XLSX)return resolve();let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=()=>resolve();s.onerror=reject;document.head.appendChild(s)})}
function keyHeader(h){return norm(h).replace(/[^a-z0-9]/g,'')}
function mapRow(row){let m={};Object.entries(row).forEach(([k,v])=>{let h=keyHeader(k);if(['fullname','name','studentname','contactname'].includes(h))m.name=v;else if(['phonenumber','phone','mobile','mobilenumber','contactnumber'].includes(h))m.phone=v;else if(['state'].includes(h))m.state=v;else if(['city','district','citydistrict'].includes(h))m.city=v;else if(['dateofbirth','dob','birthdate'].includes(h))m.dob=v;else if(['age'].includes(h))m.age=v;else if(['mf','gender','sex'].includes(h))m.gender=v;else if(['gameparticipation','game','sport','sports','games'].includes(h))m.game=v;else if(['category','type'].includes(h))m.category=v;else if(['status'].includes(h))m.status=v;else if(['nextfollowupdate','followupdate','nextdate','followupdate'].includes(h))m.nextDate=v;else if(['followupaction','nextaction','action'].includes(h))m.nextAction=v;else if(['tags','tag'].includes(h))m.tags=v;else if(['notes','remarks','comment'].includes(h))m.notes=v});return m}
function dateVal(v){if(!v)return '';if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);if(typeof v==='number'&&window.XLSX){let d=XLSX.SSF.parse_date_code(v);if(d)return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0')}let s=String(v).trim();let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return s.slice(0,10)}
function normImported(m){return {name:String(m.name||'').trim(),phone:String(m.phone||'').trim(),state:String(m.state||'').trim(),city:String(m.city||'').trim(),dob:dateVal(m.dob),age:m.age==null?'':String(m.age),gender:String(m.gender||'').trim(),game:String(m.game||'').trim(),category:String(m.category||'').trim(),status:String(m.status||'Pending').trim()||'Pending',nextDate:dateVal(m.nextDate),nextAction:String(m.nextAction||'').trim(),tags:String(m.tags||'').trim(),notes:String(m.notes||'').trim()}}
document.getElementById('importfile').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let rows;if(file.name.toLowerCase().endsWith('.json')){let data=JSON.parse(await file.text());if(!Array.isArray(data.contacts))throw Error('This backup does not contain a contacts list.');if(!confirm('Restore '+data.contacts.length+' contacts? Existing records will remain; duplicates will be skipped.'))return;rows=data.contacts.map(c=>normImported(c));if(Array.isArray(data.templates)){templates=data.templates;saveTemplates()}}else if(file.name.toLowerCase().endsWith('.csv')){let text=await file.text();rows=parseCSV(text).map(r=>{let obj={};r.forEach((v,i)=>obj[headers[i]]=v);return normImported(mapRow(obj))});let headers=parseCSV(text)[0];rows=parseCSV(text).slice(1).map(r=>{let obj={};headers.forEach((h,i)=>obj[h]=r[i]||'');return normImported(mapRow(obj))})}else{await loadXLSX();let wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});let sheet=wb.Sheets[wb.SheetNames[0]];let raw=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false});rows=raw.map(r=>normImported(mapRow(r)))}let added=0,skipped=0,invalid=0;let existing=new Set(contacts.map(c=>phoneNorm(c.phone)).filter(Boolean));for(let c of rows){if(!c.name&&!c.phone)continue;if(!c.name||!c.phone){invalid++;continue}let p=phoneNorm(c.phone);if(p&&existing.has(p)){skipped++;continue}await put(c);if(p)existing.add(p);added++}await refresh();document.getElementById('importresult').innerHTML='<div class="goodnotice"><b>Import finished</b><br>Added: '+added+'<br>Skipped duplicate phones: '+skipped+'<br>Rows missing name or phone: '+invalid+'</div>';toast('Import complete: '+added+' contacts added')}catch(err){toast('Import failed: '+err.message);alert('Import failed: '+err.message)}finally{e.target.value=''}});
function parseCSV(text){let rows=[],row=[],s='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'&&q&&text[i+1]==='"'){s+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(s);s=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(s);rows.push(row);row=[];s=''}else s+=c}if(s.length||row.length){row.push(s);rows.push(row)}return rows}
async function init(){try{await openDB();await refresh()}catch(e){document.getElementById('view').innerHTML='<div class="card"><h2>Storage could not be opened</h2><p>Please use a current browser and ensure site storage is allowed.</p></div>'}}
init();
</script>
